# -------------------------------------------------------------------
# SMB FinSight - Main configuration file
# -------------------------------------------------------------------
# Notes:
# - All other sections and keys are optional.
# - Any standard-specific configuration (mappings, ratios packs, etc.)
#   will be loaded from a standard-specific config file, not here.
# -------------------------------------------------------------------

[fiscal_year]
# Default fiscal year used when no custom period is provided.
start_date = "2026-01-01"
end_date   = "2026-12-31"

# -------------------------------------------------------------------
# Accounting standard
# -------------------------------------------------------------------
[accounting]

# Optional reporting currency (informational, for display).
# Supported: "CAD", "USD", "EUR"
currency = "CAD"

# Thousands separator used for display formatting.
# Supported: "," or " "
thousands_separator = ","

# Path to a standard-specific config file (required).
# This file defines the standard name displayed in the Web UI as well as
# the statement mappings and ratios packs to load.
# Four files are currently available : "US_GAAP" (United States
#   Generally Accepted Accounting Principles), "IFRS" (International
#   Financial Reporting Standards), "CA_ASPE" (Canadian Accounting 
#   Standards for Private Enterprises), "FR_PCG" (Plan Comptable 
#   Général Français).
# Example (for a Canadian company under ASPE):
#   standard_config_file = "config/standard_ca_aspe.toml"
# Example (for a French company):
#   standard_config_file = "config/standard_fr_pcg.toml"
standard_config_file = "config/standards/standard_ca_aspe.toml"

# -------------------------------------------------------------------
# Database
# -------------------------------------------------------------------
[database]
# Database engine used by SMB FinSight.
# For now, only "sqlite" is supported.
engine = "sqlite"

# Relative path to the SQLite database file.
# It will be resolved relative to the directory of this config file.
path = "data/db/smb_finsight.sqlite"


# -------------------------------------------------------------------
# Ratios & KPIs configuration (for CLI only)
# -------------------------------------------------------------------
[ratios]

# Default level of detail when displaying ratios.
# Possible values:
#   "basic"
#   "advanced"
#   "full"
# Note (WebUI):
#   The WebUI currently always computes ratios at level "full" because
#   some dashboard tiles and charts depend on advanced/full ratios.
#   This setting is currently used by the CLI only.
default_level = "basic"

# -------------------------------------------------------------------
# Optional inputs - Balance sheet
# -------------------------------------------------------------------
[inputs.balance_sheet]
# All fields below are optional. If a value is missing, any ratio that
# depends on it will simply not be computed (it will be reported as N/A).

total_assets         = 520000.00  # Total Assets
total_equity         = 345000.00  # Total Equity
financial_debt       = 85000.00  # Financial debt (short + long term)
cash_and_equivalents = 285000.00  # Cash and cash equivalents
accounts_receivable  = 165000.00  # Trade receivables
accounts_payable     = 90000.00  # Trade payables
inventory            = 15000.00  # Inventory
working_capital      = 275000.00  # Working capital (optional)
interest_expense     = 3800.00  # Interest expense on financial debt

# -------------------------------------------------------------------
# Optional inputs - Human resources
# -------------------------------------------------------------------
[inputs.hr]
# Average headcount (or FTE) over the period.
# Used for productivity ratios (revenue per FTE, VA per FTE, etc.).
average_headcount = 11.5

# -------------------------------------------------------------------
# CLI configuration
# -------------------------------------------------------------------
[cli]
# Default output mode for tables:
#   "table" -> console table (ASCII / Markdown-like)
#   "csv"   -> CSV export
#   "both"  -> console + CSV file
display_mode = "table"

# Number of decimals for ratio percentage display.
ratio_decimals = 1

# -------------------------------------------------------------------
# Web UI configuration
# -------------------------------------------------------------------
[webui]
# Path to the layout configuration file for the Web UI.
# You can switch to the French version later with:
# layout_config_path = "config/layout/layout_fr.toml"
layout_config_path = "config/layout/layout_en.toml"

