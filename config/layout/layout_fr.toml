# -------------------------------------------------------------------
# SMB FinSight - Layout configuration
# Version française

# Configuration de layout pour l’interface Web SMB FinSight.
#
# Ce fichier contrôle :
# - titres des pages et options de navigation
# - préréglages de périodes par défaut pour certaines pages (primaire & comparaison)
# - tuiles & graphiques pour certaines pages (mesures/ratios)
# - comportement des pages états, écritures, doublons, import, configuration
#
# PRINCIPES GÉNÉRAUX
# ------------------
# Ce fichier de layout configure la navigation WebUI et les réglages par page.
#
# 1) Registre des pages :
#    Chaque page est déclarée sous [pages.<page>] avec :
#      - id    : identifiant unique utilisé par le routeur
#      - title : titre affiché dans la navigation et l’en-tête
#      - icon  : emoji/icone affiché dans la navigation
#      - [pages.<page>.ui] : libellés UI, valeurs par défaut, messages spécifiques
#
# 2) Séparation des responsabilités :
#    - Ce fichier définit “quoi afficher” et le comportement UI pour chaque page.
#    - Les définitions métier (formules, unités, libellés par défaut, notes) vivent
#      dans les packs de calcul (mesures canoniques et ratios_*.toml).
#    - Le layout NE DOIT PAS dupliquer les définitions métier par défaut.
#      Il peut surcharger des aspects purement UI (label, infobulles, politique de delta).
#
# 3) Périmètre des fonctionnalités optionnelles :
#    - Certaines pages sont analytiques et peuvent utiliser des contrôles de période
#      et des comparaisons (ex. Dashboard, Ratios & KPIs, Compte de résultat).
#    - D’autres pages sont opérationnelles et n’utilisent généralement pas de périodes
#      (ex. Écritures, Doublons, Import & Configuration).
#    - Les réglages de période (préréglages/granularité) ne sont donc définis
#      que dans les sections des pages concernées.

# -------------------------------------------------------------------

[meta]
id = "default_fr"          # Identifiant de cette configuration de layout
schema_version = "0.5.0"   # Version du schéma comprise par la WebUI
language = "fr"            # Langue principale des libellés/titres dans ce fichier
default_page = "dashboard" # Page ouverte par défaut : dashboard | statements | ratios | entries | duplicates | import_config

# -------------------------------------------------------------------
# DÉFINITION DES PAGES
# -------------------------------------------------------------------
# Chaque section [pages.<page>] définit :
#   - id : identifiant interne de la page (utilisé par le routeur)
#   - title : libellé dans la navigation et l’en-tête
#   - icon : petit emoji/icone dans la navigation (optionnel)
#   - (optionnel) allow_secondary_period :
#       Pertinent seulement pour les pages analytiques supportant la comparaison.
#       Si true, l’UI peut proposer une période de comparaison et afficher des deltas.
#   - (optionnel) bloc [pages.<page>.periods] :
#       Uniquement pour les pages nécessitant des préréglages / contrôles de granularité.
#   - [pages.<page>.ui] :
#       Libellés UI, valeurs par défaut et messages spécifiques à la page.
# -------------------------------------------------------------------

# ----------------- Page Dashboard -----------------
[pages.dashboard]
id = "dashboard"
title = "Tableau de bord"
icon = "📊"

# allow_secondary_period:
# - true  -> l’UI peut afficher un sélecteur de période de comparaison et calculer les deltas
# - false -> période primaire uniquement (pas de comparaison, pas de deltas)
allow_secondary_period = true

[pages.dashboard.ui]
# Libellés UI et valeurs par défaut pour le Dashboard.

section_key_metrics = "Indicateurs clés"
section_trends = "Tendances"
default_enable_comparison = false               # si true, “Comparer à une autre période” est activé par défaut

label_primary_period = "Période principale"
label_comparison_toggle = "Comparer à une autre période"
label_comparison_period = "Période de comparaison"
label_granularity = "Granularité"

label_custom_from = "Du"
label_custom_to = "Au"

# Infobulles / aide
help_primary_period = "Sélectionnez la période principale de reporting."
help_comparison_toggle = "Activez pour comparer avec une autre période."
