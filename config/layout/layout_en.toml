# -------------------------------------------------------------------
# DASHBOARD LAYOUT
# -------------------------------------------------------------------
# The dashboard is a configurable overview page composed of:
# - metric tiles (st.metric-like cards)
# - charts
#
# Dashboard items are defined explicitly (one entry per tile / per chart),
# because this page is meant to be highly customizable.
#
# Notes on data sources:
# - Tiles and charts reference computed "measures" or "ratios" by key.
# - Default label/unit/notes are provided by the computation packs.
# - This dashboard layout may override UI-only fields (label, formatting,
#   delta display policy, tooltip text).
#
# Period controls:
# - The dashboard can use a primary period and an optional comparison period.
# - Page defaults are defined under [pages.dashboard.periods].
# - Individual tiles/charts may optionally override presets (rare):
#     period_preset / comparison_preset
#
# Delta semantics:
# - delta_good_direction controls whether an increase is considered "good"
#   ("up") or a decrease is considered "good" ("down") for coloring.
# - show_delta_abs / show_delta_pct control delta display (if comparison enabled).


[dashboard]

# ===== DASHBOARD TILES (metrics) =====
#
# Each [[dashboard.tiles]] entry defines a tile (metric card).
# Fields:
#   id                : unique identifier within dashboard tiles
#   source            : "measure" | "ratio" | "system"
#   key               : measure/ratio/system identifier
#   label             : display label for the tile
#   format            : "amount" | "percent" | "number" (optional override of underlying unit)
#   show_delta_abs    : whether to show absolute delta vs secondary period
#   show_delta_pct    : whether to show relative delta vs secondary period
#   delta_good_direction : "up" | "down"
#   tooltip_from      : "measure_notes" | "ratio_notes" | "none"

[[dashboard.tiles]]
id = "revenue"
source = "measure"
key = "revenue_abs"
label = "Revenue"
format = "amount"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "up"
tooltip_from = "measure_notes"

[[dashboard.tiles]]
id = "gross_margin"
source = "measure"
key = "gross_margin_abs"
label = "Gross margin"
format = "amount"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "up"
tooltip_from = "measure_notes"

[[dashboard.tiles]]
id = "operating_income"
source = "measure"
key = "operating_income_abs"
label = "Operating income"
format = "amount"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "up"
tooltip_from = "measure_notes"

[[dashboard.tiles]]
id = "net_income"
source = "measure"
key = "net_income_abs"
label = "Net income"
format = "amount"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "up"
tooltip_from = "measure_notes"

[[dashboard.tiles]]
id = "external_charges_abs"
source = "measure"
key = "external_charges_abs"
label = "External charges"
format = "amount"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "down"
tooltip_from = "measure_notes"

[[dashboard.tiles]]
id = "roce_pct"
source = "ratio"
key = "roce_pct"
label = "ROCE (%)"
format = "percent"
show_delta_abs = true
show_delta_pct = false
delta_good_direction = "up"
tooltip_from = "ratio_notes"

[[dashboard.tiles]]
id = "equity_ratio_pct"
source = "ratio"
key = "equity_ratio_pct"
label = "Equity ratio (%)"
format = "percent"
show_delta_abs = true
show_delta_pct = false
delta_good_direction = "up"
tooltip_from = "ratio_notes"

[[dashboard.tiles]]
id = "dso_days"
source = "ratio"
key = "dso_days"
label = "DSO (Days Sales Outstanding) (days)"
format = "number"
show_delta_abs = true
show_delta_pct = true
delta_good_direction = "down"
tooltip_from = "ratio_notes"

# NOTE:
# We deliberately do NOT define a "duplicates" tile on the Dashboard.
# Instead, the Duplicates page can show a badge/notification in the navigation
# when there are pending duplicates (see [duplicates_page] section below).


# ===== DASHBOARD CHARTS =====
#
# Each [[dashboard.charts]] defines a chart.
# Fields:
#   id                : unique identifier of the chart
#   type              : "line" | "bar"
#   title             : chart title
#   default_granularity / allowed_granularities :
#                      controls how the primary period is split into subperiods.
# Granularity is used for charts (time series). Summary tiles always use full periods.

# Sub-tables:
#   [[dashboard.charts.series]]
#   - source : "measure" | "ratio"
#   - key    : measure/ratio identifier
#   - label  : label in the legend

[[dashboard.charts]]
id = "revenue_and_margin_evolution"
type = "line"
title = "Revenue & gross margin evolution"


[[dashboard.charts.series]]
source = "measure"
key = "revenue_abs"
label = "Revenue"

[[dashboard.charts.series]]
source = "measure"
key = "gross_margin_abs"
label = "Gross margin"


[[dashboard.charts]]
id = "profitability_evolution"
type = "bar"
title = "Profitability evolution"


[[dashboard.charts.series]]
source = "measure"
key = "operating_income_abs"
label = "Operating income"

[[dashboard.charts.series]]
source = "measure"
key = "net_income_abs"
label = "Net income"


# -------------------------------------------------------------------
# RATIOS & KPIs PAGE
# -------------------------------------------------------------------
#
# Purpose:
# - Define the Ratios & KPIs page content and ordering.
# - The page is organized into semantic sections.
# - Within each section, we render:
#     1) Measures (amount-valued metrics)  -> tiles
#     2) Ratios (percent/days/multiples)   -> tiles
#     3) Charts (optional, later)          -> charts
#
# Key design principles:
# - Do NOT duplicate labels/units/notes in layout by default.
#   The "pack" (ratios_*.toml) remains the source of truth for:
#     - label (default)
#     - unit
#     - notes
#     - formula
#     - category
#
# - UI overrides are allowed when needed (label, delta display, tooltip).
#
# Tile spec rules:
# - key: metric identifier, must exist in the computed outputs.
# - delta_good_direction: REQUIRED. Values: "up" or "down".
#   "up"   means an increase vs comparison is considered good (green).
#   "down" means a decrease vs comparison is considered good (green).
#
# Optional overrides (if present, they override the pack):
# - label: overrides the default label from the pack.
# - show_delta_abs: overrides delta absolute display (true/false).
# - show_delta_pct: overrides delta percent display (true/false).
# - tooltip_from: overrides the tooltip text. If omitted, we use pack notes.
#   If present, tooltip_from must be a string and will REPLACE pack notes.
#
# Ordering:
# - The display order is exactly the order of [[...]] items in this file.
# -------------------------------------------------------------------

[ratios_page]

# --------------------- Section 1: Profitability ---------------------
[[ratios_page.sections]]
id = "profitability"
title = "Profitability"

[[ratios_page.sections.tiles]]
