# -------------------------------------------------------------------
# STATEMENTS PAGE OPTIONS
# -------------------------------------------------------------------
# These options control how the income statement is displayed.

[statements_page]

# Secondary statement rendering when it exists:
# - "tabs"    : primary + secondary in tabs
# - "stacked" : primary then secondary below
secondary_statement_display = "tabs"  # "tabs" | "stacked"

# Zero-line behavior in comparison mode:
#   true  -> hide lines where both periods are zero (and delta is zero)
#   false -> show all lines, even if both periods are zero
hide_zero_lines_in_comparison = true

# Zero-line behavior in single-period mode:
#   true  -> hide lines where the amount is zero
#   false -> show the full structure, including zero lines
hide_zero_lines_single_period = true

# "engine_signed" : show engine values as-is (revenues +, expenses -)
# "traditional"   : show abs(amount) but indicate negatives from engine
amount_display_mode = "traditional"  # "engine_signed" | "traditional"

# How to indicate values that are negative in engine (when mode="traditional"):
# - "parentheses" : (1,234)
# - "color"  : colored cells
# - "both"        : parentheses + highlighted cells
negative_amount_indicator = "both"  # "parentheses" | "color" | "both"

# If non-empty, display a legend below the table(s)
legend_text = "Parentheses / colored amounts indicate values that are negative in the underlying data."


# -------------------------------------------------------------------
# ENTRIES PAGE OPTIONS
# -------------------------------------------------------------------
# Controls which columns are visible and how manual entries behave.

[entries_page]

# ------------------------------------------------------------
# Manual entry (Add / Edit dialogs)
# ------------------------------------------------------------
[entries_page.manual_entry]

# Default input mode for dialogs:
# - "amount"        → single signed amount
# - "debit_credit"  → debit / credit inputs, converted to amount
input_mode = "amount"

# Default value for the toggle:
# "Reject unknown accounts (prefix matching)"
toggle_default_reject_unknown_accounts = true

# ------------------------------------------------------------
# Import behavior
# ------------------------------------------------------------
[entries_page.import]

# Default state of "Reject unknown accounts" toggle for CSV import
default_reject_unknown_accounts = true

# ------------------------------------------------------------
# Pagination defaults
# ------------------------------------------------------------
[entries_page.pagination]

# NOTE: v0.5.0 uses a soft display cap (max_limit) but does not implement pagination yet.
# default_limit and allowed_limits are reserved for a future pagination feature.

# Default number of rows per page
default_limit = 200

# Allowed page size options exposed to the user
allowed_limits = [50, 100, 200, 500, 1000]

# Hard cap to avoid UI freezing on large datasets
max_limit = 2000



# -------------------------------------------------------------------
# CONFIG PAGE OPTIONS
# -------------------------------------------------------------------
# Controls behaviour of the Configuration page.

[config_page]
# Directory (relative to project root) where CSV files are stored/read from.
input_dir = "data/input"

# Behaviour when uploading a file with a name that already exists in input_dir:
#   "ask"        -> ask the user what to do
#   "overwrite"  -> replace the existing file
#   "keep_both"  -> keep both, by adding a suffix to the new file
#   "skip"       -> abort the upload
on_existing_filename = "ask"

# Whether to show a dropdown list of existing CSV files in input_dir
# so the user can re-import them directly from the WebUI.
show_existing_files_selector = true