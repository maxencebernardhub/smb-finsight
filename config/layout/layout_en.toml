key = "gross_margin_abs"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "ratio"
key = "gross_margin_pct"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "measure"
key = "ebitda_abs"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "ratio"
key = "ebitda_margin_pct"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "measure"
key = "operating_income_abs"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "ratio"
key = "operating_margin_pct"
delta_good_direction = "up"

[[ratios_page.sections.tiles]]
source = "measure"
