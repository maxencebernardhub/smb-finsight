# -------------------------------------------------------------------
# SMB FinSight - Layout configuration
# English version

# Layout configuration for SMB FinSight Web UI.
#
# This file controls:
# - page titles & navigation options
# - default period presets for some pages (primary & secondary)
# - tiles & charts for some pages (measures/ratios)
# - behaviour of statements, entries, duplicates, import pages
#
# GENERAL PRINCIPLES
# ------------------
# This layout file configures the WebUI navigation and per-page settings.
#
# 1) Page registry:
#    Each page is declared under [pages.<page>] with:
#      - id    : unique page identifier used by the router
#      - title : page title shown in navigation and header
#      - icon  : emoji/icon displayed in navigation
#      - [pages.<page>.ui] : page-specific UI labels, defaults and messages
#
# 2) Separation of concerns:
#    - This file defines "what to display" and UI behavior for each page.
#    - Business definitions (formulas, units, default labels, notes) live in
#      the computation packs (canonical measures and ratios_*.toml).
#    - The layout SHOULD NOT duplicate business definitions by default.
#      It may override UI-only aspects (label, tooltips, delta display policy).
#
# 3) Scope of optional features:
#    - Some pages are analytical and may use period controls and comparisons
#      (e.g., Dashboard, Ratios & KPIs, Income Statement).
#    - Other pages are operational and typically do not use periods
#      (e.g., Entries, Duplicates, Import & Configuration).
#    - Period-related settings (presets/granularity) are therefore defined
#      only inside the relevant page sections.

# -------------------------------------------------------------------

[meta]
id = "default_en"          # Identifier of this layout configuration
schema_version = "0.5.0"   # Layout schema version understood by the WebUI
language = "en"            # Main language of labels/titles in this file
default_page = "dashboard" # Page opened by default: dashboard | statements | ratios | entries | duplicates | import_config

# -------------------------------------------------------------------
# PAGE DEFINITIONS
# -------------------------------------------------------------------
# Each [pages.<page>] section defines:
#   - id: internal identifier of the page (used by the router)
#   - title: label used in navigation and page header
#   - icon: small emoji/icon in navigation (optional)
#   - (optional) allow_secondary_period:
#       Only meaningful for analytical pages that support comparisons
#       (e.g., Dashboard, Ratios, Income Statement).
#       If true, the UI can offer a comparison period selector and deltas.
#   - (optional) nested [pages.<page>.periods] block:
#       Only for pages that need period presets / granularity controls.
#       Operational pages typically omit this block.
#   - [pages.<page>.ui]:
#       Page-specific UI labels, defaults and messages.
# -------------------------------------------------------------------

# ----------------- Dashboard page -----------------
[pages.dashboard]
id = "dashboard"
title = "Dashboard"
icon = "📊"

# allow_secondary_period:
