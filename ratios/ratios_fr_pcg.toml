# -------------------------------------------------------------------
# SMB FinSight - Measures & ratios rules
# France / PCG
# -------------------------------------------------------------------

[meta]
standard    = "FR_PCG"
version     = "0.3.0"
description = "Mesures et ratios financiers basés sur les variables canoniques du PCG."

# -------------------------------------------------------------------
# Derived measures (measures.*)
# -------------------------------------------------------------------

[measures.revenue_abs]
label   = "Chiffre d'Affaires net"
formula = "revenue"
unit    = "amount"
category = "profitability_amount"
notes   = "Chiffre d'Affaires net en valeur absolue."

[measures.gross_margin_abs]
label   = "Marge brute"
formula = "revenue + cost_of_goods_sold"
unit    = "amount"
category = "profitability_amount"
notes   = "Marge brute en valeur absolue (CA net + coût d'achat des marchandises vendues / consommations, en charges négatives)."

[measures.value_added_abs]
label   = "Valeur ajoutée"
formula = "value_added"
unit    = "amount"
category = "profitability_amount"
notes   = "Valeur ajoutée en valeur absolue."

[measures.ebitda_abs]
label   = "EBE"
formula = "ebe"
unit    = "amount"
category = "profitability_amount"
notes   = "EBE (Excédent Brut d'Exploitation) en valeur absolue."

[measures.operating_income_abs]
label   = "Résultat d'exploitation"
formula = "operating_income"
unit    = "amount"
category = "profitability_amount"
notes   = "Résultat d'exploitation en valeur absolue."

[measures.income_before_tax_abs]
label   = "Résultat courant avant impôts"
formula = "current_result_sig"
unit    = "amount"
category = "tax"
notes   = "Résultat courant avant impôts en valeur absolue."

[measures.net_income_abs]
label   = "Résultat net"
formula = "net_income"
unit    = "amount"
category = "profitability_amount"
notes   = "Résultat net en valeur absolue."

[measures.cogs_abs]
label   = "Total achats"
formula = "(-cost_of_goods_sold)"
unit    = "amount"
category = "efficiency_cost"
notes   = "Total des achats en valeur absolue."

[measures.operating_expenses_abs]
label   = "Charges d'exploitation"
formula = "(-total_operating_expenses)"
unit    = "amount"
category = "efficiency_cost"
notes   = "Charges d'exploitation en valeur absolue."

[measures.external_charges_abs]
label   = "Charges externes"
formula = "(-external_charges)"
unit    = "amount"
category = "efficiency_cost"
notes   = "Charges externes en valeur absolue."

[measures.personnel_expenses_abs]
label   = "Charges de personnel"
formula = "(-personnel_expenses)"
unit    = "amount"
category = "efficiency_cost"
notes   = "Charges de personnel en valeur absolue."

[measures.finance_cost_abs]
label   = "Charges financières"
formula = "(-financial_expenses)"
unit    = "amount"
category = "efficiency_cost"
notes   = "Charges financières en valeur absolue."

[measures.income_tax_abs]
label   = "Impôt sur les bénéfices"
formula = "(-income_tax_expense)"
unit    = "amount"
category = "tax"
notes   = "Impôt sur les bénéfices en valeur absolue."

[measures.revenue_per_fte]
label   = "CA par salarié"
formula = "revenue / average_headcount"
unit    = "amount"
category = "productivity"
notes   = "Chiffre d'affaires divisé par l'effectif moyen (ETP)."

[measures.value_added_per_fte]
label   = "VA par salarié"
formula = "value_added / average_headcount"
unit    = "amount"
category = "productivity"
notes   = "Valeur ajoutée divisée par l'effectif moyen (ETP)."

[measures.capital_employed]
label   = "Capitaux engagés"
formula = "total_equity + financial_debt - cash_and_equivalents"
unit    = "amount"
category = "structure"
notes   = "Approximation des capitaux engagés : Capitaux propres + Dettes financières - Trésorerie."

[measures.net_debt]
label   = "Endettement net"
formula = "financial_debt - cash_and_equivalents"
unit    = "amount"
category = "structure"
notes   = "Dette nette : Dettes financières - Trésorerie et équivalents."

[measures.caf]
label   = "Capacité d'autofinancement (CAF)"
formula = "net_income - depreciation_amortization"
unit    = "amount"
category = "profitability_amount"
notes   = "CAF simplifiée: résultat net ajusté des dotations aux amortissements et provisions d'exploitation. Ne tient pas compte de l'ensemble des produits et charges calculés (reprises, autres dotations, etc.)."


# -------------------------------------------------------------------
# Ratios - BASIC level
# -------------------------------------------------------------------

[ratios.basic.gross_margin_pct]
label   = "Marge brute (%)"
formula = "(gross_margin_abs / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "Marge brute rapportée au chiffre d'affaires."

[ratios.basic.operating_margin_pct]
label   = "Résultat d'exploitation (%)"
formula = "(operating_income / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "Résultat d'exploitation rapporté au chiffre d'affaires."

[ratios.basic.net_margin_pct]
label   = "Résultat net (%)"
formula = "(net_income / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "Résultat net rapporté au chiffre d'affaires."

# -------------------------------------------------------------------
# Ratios - ADVANCED level
# -------------------------------------------------------------------

[ratios.advanced.cogs_ratio_pct]
label   = "Total des achats / CA net (%)"
formula = "(-cost_of_goods_sold / revenue)"
unit    = "percent"
category = "efficiency_cost"
notes   = "Total des achats rapporté au chiffre d'affaires."

[ratios.advanced.operating_expense_ratio_pct]
label   = "Charges d'exploitation / CA net (%)"
formula = "(-total_operating_expenses / revenue)"
unit    = "percent"
category = "efficiency_cost"
notes   = "Charges d'exploitation rapportées au chiffre d'affaires."

[ratios.advanced.external_charges_pct]
label   = "Charges externes / CA (%)"
formula = "(-external_charges / revenue)"
unit    = "percent"
category = "efficiency_cost"
notes   = "Charges externes rapportées au chiffre d'affaires."

[ratios.advanced.personnel_expenses_pct]
label   = "Charges de personnel / CA (%)"
formula = "(-personnel_expenses / revenue)"
unit    = "percent"
category = "efficiency_cost"
notes   = "Charges de personnel rapportées au chiffre d'affaires."

[ratios.advanced.finance_cost_ratio_pct]
label   = "Charges financières / CA net (%)"
formula = "(-financial_expenses / revenue)"
unit    = "percent"
category = "efficiency_cost"
notes   = "Charges financières rapportées au chiffre d'affaires."

[ratios.advanced.value_added_pct]
label   = "Valeur ajoutée (%)"
formula = "(value_added / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "Valeur ajoutée rapportée au chiffre d'affaires."

[ratios.advanced.ebitda_margin_pct]
label   = "EBE (%)"
formula = "(ebitda_abs / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "EBE (Excédent Brut d'Exploitation) rapporté au chiffre d'affaires."

[ratios.advanced.caf_margin_pct]
label   = "CAF / CA (%)"
formula = "(caf / revenue)"
unit    = "percent"
category = "profitability_margin"
notes   = "CAF rapportée au chiffre d'affaires."

[ratios.advanced.effective_tax_rate_pct]
label   = "Impôt sur les bénéfices (%)"
formula = "(-income_tax_expense / income_before_tax_abs)"
unit    = "percent"
category = "tax"
notes   = "Impôt sur les bénéfices rapporté au Résultat Courant Avant Impôt."

[ratios.advanced.roce_pct]
label   = "ROCE (%)"
formula = "(operating_income / capital_employed)"
unit    = "percent"
category = "returns"
notes   = "Rentabilité des capitaux engagés (Return On Capital Employed)."

[ratios.advanced.roe_pct]
label   = "ROE (%)"
formula = "(net_income / total_equity)"
unit    = "percent"
category = "returns"
notes   = "Rentabilité des capitaux propres (Return On Equity)."

[ratios.advanced.roa_pct]
label   = "ROA (%)"
formula = "(net_income / total_assets)"
unit    = "percent"
category = "returns"
notes   = "Rentabilité économique des actifs (Return On Assets)."

# -------------------------------------------------------------------
# Ratios - FULL level
# -------------------------------------------------------------------

[ratios.full.caf_to_ebe]
label   = "CAF / EBE"
formula = "caf / ebe"
unit    = "ratio"
category = "profitability_margin"
notes   = "Mesure la conversion de l'EBE en CAF."

[ratios.full.finance_cost_coverage]
label   = "Couverture des charges financières (EBE / charges financières)"
formula = "ebe / (-financial_expenses)"
unit    = "ratio"
category = "structure"
notes   = "Capacité de l'entreprise à couvrir ses charges financières avec l'EBE."

[ratios.full.equity_ratio_pct]
label   = "Autonomie financière (%)"
formula = "(total_equity / total_assets)"
unit    = "percent"
category = "structure"
notes   = "Poids des capitaux propres dans le total de l'actif (autonomie financière)."

[ratios.full.debt_to_equity]
label   = "Endettement (Dettes financières / Capitaux propres)"
formula = "financial_debt / total_equity"
unit    = "ratio"
category = "structure"
notes   = "Dettes financières rapportées aux capitaux propres."

[ratios.full.gearing]
label   = "Gearing (Dette nette / Capitaux propres)"
formula = "net_debt / total_equity"
unit    = "ratio"
category = "structure"
notes   = "Dette nette rapportée aux capitaux propres."

[ratios.full.dso_days]
label   = "Délai de paiement clients (jours)"
formula = "(accounts_receivable / revenue) * period_days"
unit    = "days"
category = "working_capital"
notes   = "Délai moyen de recouvrement des créances clients."

[ratios.full.dpo_days]
label   = "Délai de paiement fournisseurs (jours)"
formula = "(accounts_payable / -cost_of_goods_sold) * period_days"
unit    = "days"
category = "working_capital"
notes   = "Délai moyen de paiement des fournisseurs (coût des ventes pris en valeur absolue)."

[ratios.full.dio_days]
label   = "Durée de rotation des stocks (jours)"
formula = "(inventory / -cost_of_goods_sold) * period_days"
unit    = "days"
category = "working_capital"
notes   = "Durée moyenne de stockage (rotation des stocks, coût des ventes en valeur absolue)."

[ratios.full.cash_conversion_cycle_days]
label = "Cycle de conversion de trésorerie (jours)"
formula = "dso_days + dio_days - dpo_days"
unit = "days"
category = "working_capital"
notes = "CCC = DSO + DIO - DPO. Plus bas est généralement meilleur."

[ratios.full.net_debt_to_ebitda]
label = "Dette nette / EBE"
formula = "net_debt / ebe"
unit = "ratio"
category = "structure"
notes = "Dette nette divisée par l'EBE."
